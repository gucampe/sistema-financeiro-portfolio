<div
  id="ajuda-overlay"
  class="modal-overlay modal-overlay--ajuda hidden"
  data-modal
  data-modal-fade
  data-evento-url="{% url 'usuarios:produto_evento' %}"
  hidden
  aria-hidden="true"
>
  <div
    id="ajuda-panel"
    class="modal-panel modal-panel--ajuda"
    role="dialog"
    aria-modal="true"
    aria-labelledby="ajuda-titulo"
    tabindex="-1"
    data-modal-panel
    data-modal-panel-scale="0"
  >
    <div class="modal-panel__header flex items-start justify-between gap-3 border-b border-gray-200 px-5 py-4 md:px-6">
      <div class="min-w-0">
        <p class="m-0 text-xs font-semibold uppercase tracking-wide text-gray-500">Ajuda</p>
        <h2 id="ajuda-titulo" class="mt-1 mb-0 text-lg font-semibold text-gray-900">Como o GranaGo funciona</h2>
      </div>
      <button
        type="button"
        class="inline-flex min-h-12 min-w-12 items-center justify-center rounded-xl text-gray-500 hover:bg-gray-100 hover:text-gray-800"
        data-modal-close
        aria-label="Fechar ajuda"
      >
        <i class="fa-solid fa-xmark text-lg" aria-hidden="true"></i>
      </button>
    </div>
    <div class="modal-panel__body px-5 py-4 md:px-6">
      <div data-ajuda-home>
        <label class="sr-only" for="ajuda-busca">Buscar na ajuda</label>
        <input
          id="ajuda-busca"
          type="search"
          class="input w-full"
          placeholder="Buscar na ajuda"
          autocomplete="off"
          data-ajuda-busca
        >
        <p class="mt-2 mb-0 hidden text-sm text-gray-500" data-ajuda-busca-vazia>
          Nenhum artigo com esse termo.
        </p>

        <section class="mt-5" data-ajuda-grupo="comece_aqui">
          <h3 class="m-0 text-xs font-semibold uppercase tracking-wide text-gray-500">Comece aqui</h3>
          <div class="mt-3 grid gap-3">
            {% for artigo in ajuda_comece_aqui %}
            <button
              type="button"
              class="min-h-12 rounded-2xl border border-gray-200 bg-white p-4 text-left shadow-sm transition hover:border-brand-500/35"
              data-ajuda-abrir="{{ artigo.id }}"
            >
              <span class="block text-base font-semibold text-gray-900">{{ artigo.titulo }}</span>
              <span class="mt-1 block text-sm leading-relaxed text-gray-500">{{ artigo.resumo }}</span>
            </button>
            {% endfor %}
          </div>
        </section>

        <section class="mt-6" data-ajuda-grupo="entenda">
          <h3 class="m-0 text-xs font-semibold uppercase tracking-wide text-gray-500">Entenda</h3>
          <div class="mt-3 grid gap-2">
            {% for artigo in ajuda_entenda %}
            <button
              type="button"
              class="flex min-h-12 items-center justify-between gap-3 rounded-xl border border-gray-200 bg-white px-4 py-3 text-left"
              data-ajuda-abrir="{{ artigo.id }}"
            >
              <span class="text-sm font-semibold text-gray-900">{{ artigo.titulo }}</span>
              <i class="fa-solid fa-chevron-right text-xs text-gray-400" aria-hidden="true"></i>
            </button>
            {% endfor %}
          </div>
        </section>
      </div>

      <div class="hidden" data-ajuda-artigo-view>
        <button
          type="button"
          class="inline-flex min-h-12 items-center gap-2 rounded-xl px-2 text-sm font-semibold text-brand-600"
          data-ajuda-voltar
        >
          <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
          Voltar
        </button>
        <h3 class="mt-3 mb-4 text-xl font-semibold text-gray-900" data-ajuda-artigo-titulo></h3>
        <div data-ajuda-artigo-corpo></div>
      </div>
    </div>
  </div>
</div>

<script type="application/json" id="ajuda-catalogo-json">{{ ajuda_catalogo_json|safe }}</script>
{% for artigo in ajuda_comece_aqui %}
<template id="ajuda-artigo-{{ artigo.id }}">{% include artigo.template %}</template>
{% endfor %}
{% for artigo in ajuda_entenda %}
<template id="ajuda-artigo-{{ artigo.id }}">{% include artigo.template %}</template>
{% endfor %}
