{% extends 'base.html' %}

{% block show_header_sidebar %}
<div class="flex items-center justify-center min-h-screen bg-surface px-4">
    <div class="card w-full max-w-md p-8 space-y-6">
        <h2 class="text-2xl font-bold text-center text-fg">Cadastro de Usuário</h2>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {% for field in form %}
                <div>
                    <label class="block mb-1 text-sm font-medium text-fg" for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <p class="text-sm text-red-500">{{ field.errors|striptags }}</p>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary btn-block">Cadastrar</button>
        </form>
        {% if form.non_field_errors %}
            <div class="mt-2 text-sm text-red-500">{{ form.non_field_errors }}</div>
        {% endif %}
    </div>
</div>
{% endblock %}
