<div id="overlay-adicionar" 
     class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 transition-opacity duration-300 opacity-0 
            flex items-center justify-center">
  <div class="bg-white rounded-2xl shadow-md p-8 w-full max-w-md relative transform scale-95 transition-all duration-300">
    <button id="btn-fechar" 
            class="absolute top-2 right-2 text-gray-500 hover:text-gray-800">✕</button>
    <h2 class="text-2xl font-semibold text-gray-800 mb-6">Nova Transação</h2>

    <form id="form-adicionar" method="POST" action="{% url 'transacoes:adicionar' %}">
      {% csrf_token %}
      <div class="mb-4">
        <label for="tipo" class="block text-sm font-medium text-gray-700 mb-1">Tipo</label>
        <select name="tipo" id="tipo" required class="w-full px-4 py-2 border rounded-md">
          <option value="">-------</option>
          <option value="despesa" selected>Despesa</option>
          <option value="receita">Receita</option>
        </select>
      </div>
      <div class="mb-4">
        <label for="id_conta" class="block text-sm font-medium text-gray-700 mb-1">Conta</label>
        {{ form.conta }}
        {% if form.conta.errors %}
          <p class="mt-1 text-sm text-red-600">{{ form.conta.errors|striptags }}</p>
        {% endif %}
      </div>
      <div class="mb-4">
        <label for="categoria" class="block text-sm font-medium text-gray-700 mb-1">Categoria</label>
        <select name="categoria" id="categoria" required class="w-full px-4 py-2 border rounded-md">
          <option value="">Selecione uma categoria</option>
          {% if categorias_despesa %}
          {% for cat in categorias_despesa %}
          <option value="{{ cat.id }}">{{ cat.nome }}</option>
          {% endfor %}
          {% endif %}
        </select>
        {# se quiser mostrar erro do Django quando vier inválido #}
        {% if form.categoria.errors %}
          <p class="mt-1 text-sm text-red-600">{{ form.categoria.errors|striptags }}</p>
        {% endif %}
      </div>

      <div class="mb-4">
        <label for="valor" class="block text-sm font-medium text-gray-700 mb-1">Valor (R$)</label>
        <input type="number" step="0.01" name="valor" id="valor" required class="w-full px-4 py-2 border rounded-md">
      </div>
      <div class="mb-4">
        <label for="descricao" class="block text-sm font-medium text-gray-700 mb-1">Descrição</label>
        <input type="text" name="descricao" id="descricao" required class="w-full px-4 py-2 border rounded-md">
      </div>
      <div class="mb-6">
        <label for="data" class="block text-sm font-medium text-gray-700 mb-1">Data</label>
        <input type="date" name="data" id="data" required class="w-full px-4 py-2 border rounded-md">
      </div>
      <button type="submit" 
              class="w-full py-2 px-4 bg-green-600 text-white rounded-md hover:bg-green-700">Salvar</button>
    </form>
  </div>
</div>
