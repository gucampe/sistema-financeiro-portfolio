<div id="overlay-importar-ofx"
     class="fixed inset-0 hidden z-[60] transition-opacity duration-300 opacity-0 flex items-center justify-center bg-black/50 p-4"
     data-preview-url="{% url 'transacoes:importar_ofx_preview' %}"
     data-confirm-url="{% url 'transacoes:importar_ofx_confirmar' %}">

  <div id="import-ofx-panel" class="bg-white rounded-2xl shadow-lg w-full max-w-[min(96vw,80rem)] max-h-[90vh] flex flex-col border border-[rgb(189_195_199_/_0.65)] relative transition-all duration-300 scale-95 opacity-90">

    <button type="button" id="btn-fechar-import-ofx"
            class="absolute top-4 right-4 z-10 flex items-center justify-center rounded-lg bg-gray-200 px-3 py-2 text-sm hover:bg-gray-300"
            aria-label="Fechar">
      ✕
    </button>

    <div class="p-6 pb-4 border-b border-gray-100 shrink-0">
      <h2 class="text-xl font-semibold text-[#34495E] pr-10">Importar OFX</h2>
      <p class="text-sm text-gray-500 mt-1">Envie o extrato, revise as linhas e escolha a categoria de cada lançamento.</p>
    </div>

    <form id="form-csrf-import-ofx" class="hidden">{% csrf_token %}</form>

    <div id="import-ofx-step-upload" class="p-6 space-y-4 shrink-0">
      <div>
        <label for="import-ofx-conta" class="block text-sm font-medium text-[#34495E] mb-1">Conta</label>
        <select id="import-ofx-conta" required
                class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
          <option value="">Selecione a conta</option>
          {% for c in contas %}
            <option value="{{ c.pk }}">{{ c.nome }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label for="import-ofx-arquivo" class="block text-sm font-medium text-[#34495E] mb-1">Arquivo (.ofx)</label>
        <input type="file" id="import-ofx-arquivo" accept=".ofx,.OFX,application/x-ofx,application/ofx,text/x-ofx"
               class="block w-full text-sm text-gray-600 file:mr-4 file:rounded-lg file:border-0 file:bg-emerald-50 file:px-4 file:py-2 file:text-sm file:font-medium file:text-emerald-700 hover:file:bg-emerald-100" />
      </div>
      <p id="import-ofx-erro-upload" class="hidden text-sm text-red-600"></p>
      <button type="button" id="btn-import-ofx-preview"
              class="w-full rounded-lg bg-emerald-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-emerald-700 disabled:opacity-50 disabled:pointer-events-none">
        Pré-visualizar
      </button>
    </div>

    <div id="import-ofx-step-preview" class="hidden flex flex-col flex-1 min-h-0">
      <div class="px-6 py-2 text-xs text-gray-500 shrink-0">
        Linhas marcadas serão importadas. Desmarque duplicatas ou linhas indesejadas.
      </div>
      <div class="px-4 sm:px-6 overflow-x-auto overflow-y-auto flex-1 min-h-[220px] max-h-[min(62vh,calc(100dvh-13rem))] border-y border-gray-100">
        <table class="w-full min-w-[52rem] text-sm text-left table-auto">
          <thead class="text-xs text-gray-500 uppercase bg-gray-50 sticky top-0 z-[1]">
            <tr>
              <th class="px-2 py-2 w-10 shrink-0"></th>
              <th class="px-2 py-2 whitespace-nowrap shrink-0">Data</th>
              <th class="px-2 py-2 min-w-[11rem] max-w-[14rem]">Descrição</th>
              <th class="px-2 py-2 text-right whitespace-nowrap shrink-0">Valor</th>
              <th class="px-2 py-2 whitespace-nowrap shrink-0">Tipo</th>
              <th class="px-2 py-2 min-w-[7.5rem]">Avisos</th>
              <th class="px-2 py-2 min-w-[17rem] w-[17rem]">Categoria</th>
            </tr>
          </thead>
          <tbody id="import-ofx-tbody"></tbody>
        </table>
      </div>
      <p id="import-ofx-erro-preview" class="hidden px-6 text-sm text-red-600 shrink-0"></p>
      <div class="p-6 flex flex-wrap gap-2 shrink-0 border-t border-gray-100">
        <button type="button" id="btn-import-ofx-voltar"
                class="rounded-lg bg-gray-200 px-4 py-2 text-sm font-medium text-gray-800 hover:bg-gray-300">
          Voltar
        </button>
        <button type="button" id="btn-import-ofx-confirmar"
                class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-emerald-700 disabled:opacity-50 disabled:pointer-events-none">
          Confirmar importação
        </button>
      </div>
    </div>

    <div id="import-ofx-loading" class="hidden absolute inset-0 bg-white/70 rounded-2xl flex items-center justify-center z-20">
      <span class="text-sm text-gray-600">Processando…</span>
    </div>
  </div>
</div>
