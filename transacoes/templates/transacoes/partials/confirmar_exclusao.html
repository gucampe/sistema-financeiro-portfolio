<div id="modal-confirmar-exclusao" data-modal data-modal-fade="300" class="modal-overlay hidden"
     data-modal-labelledby="modal-exclusao-titulo">
  <div data-modal-panel class="modal-panel mx-auto w-full max-w-md">
    <div class="modal-panel__body space-y-2 px-5 py-5 sm:px-6 sm:py-6">
      <h3 id="modal-exclusao-titulo" class="text-lg font-semibold text-gray-800">
        Excluir transação
      </h3>

      <p class="text-sm text-gray-500">
        Tem certeza que deseja excluir esta transação? Essa ação não pode ser desfeita.
      </p>
    </div>

    <div class="modal-panel__footer flex flex-col-reverse gap-3 px-5 py-4 sm:flex-row sm:justify-end sm:px-6">
      <button id="cancelar-exclusao" type="button" data-modal-close class="btn btn-secondary btn-sm w-full sm:w-auto">
        Cancelar
      </button>
      <button id="confirmar-exclusao" type="button" class="btn btn-danger btn-sm w-full sm:w-auto">
        Excluir
      </button>
    </div>
  </div>
</div>
