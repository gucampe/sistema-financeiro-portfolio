{% extends 'base.html' %}
{% block title %}Editar transação{% endblock %}

{% block breadcrumb %}
<nav class="app-header-breadcrumb min-w-0 flex-1" aria-label="Você está em">
  <ol class="app-header-breadcrumb__list">
    <li class="app-header-breadcrumb__item min-w-0">
      <span class="app-header-breadcrumb__current block truncate text-lg font-semibold tracking-tight text-gray-800">Transações</span>
    </li>
  </ol>
</nav>
{% endblock %}

{% block content %}
<div class="min-h-screen bg-[#f6f8f7] py-6 sm:py-8 px-3 sm:px-4 lg:px-6">
  <div class="w-full max-w-md sm:max-w-lg mx-auto">
    <h1 class="text-2xl font-semibold text-[#2f3a35] mb-6">Editar transação</h1>
    <form method="post" action="">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="w-full py-2 px-4 bg-[#2f7cf6] text-white rounded-lg hover:bg-[#1f6ae0]">Salvar</button>
    </form>
    <p class="mt-4">
      <a href="/transacoes/" class="text-sm text-gray-600 hover:text-gray-800">← Voltar ao histórico</a>
    </p>
  </div>
</div>
{% endblock %}
