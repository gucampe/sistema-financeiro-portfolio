<div
  id="cookie-consent-banner"
  class="fixed bottom-0 inset-x-0 z-50 hidden border-t border-gray-200 bg-white/95 backdrop-blur px-4 py-4 shadow-lg"
  {% if meta_pixel_id %}data-marketing-choice="1"{% endif %}
>
  <div class="mx-auto flex max-w-4xl flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    {% if meta_pixel_id %}
    <p class="text-sm text-fg-muted">
      Usamos cookies essenciais para sessão e segurança.
      Se você aceitar, também usamos cookies da Meta para medir anúncios e cadastros.
      <a href="{% url 'usuarios:privacidade' %}#cookies" class="text-brand-600 hover:underline">Saiba mais</a>.
    </p>
    <div class="flex shrink-0 flex-col gap-2 sm:flex-row">
      <button type="button" id="cookie-consent-accept" class="btn btn-outline btn-sm">
        Só essenciais
      </button>
      <button type="button" id="cookie-consent-marketing" class="btn btn-primary btn-sm">
        Aceitar cookies de anúncios
      </button>
    </div>
    {% else %}
    <p class="text-sm text-fg-muted">
      Usamos cookies essenciais para sessão e segurança.
      <a href="{% url 'usuarios:privacidade' %}#cookies" class="text-brand-600 hover:underline">Saiba mais</a>.
    </p>
    <button type="button" id="cookie-consent-accept" class="btn btn-primary btn-sm shrink-0">Entendi</button>
    {% endif %}
  </div>
</div>
