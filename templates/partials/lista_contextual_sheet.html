<div id="overlay-lista-contextual-acoes"
     data-modal
     data-modal-fade="300"
     data-modal-panel-scale="0"
     class="modal-overlay modal-overlay--sheet hidden"
     data-modal-labelledby="lista-contextual-sheet-titulo"
     aria-hidden="true">
  <div data-modal-panel
       class="lista-contextual-acoes-sheet modal-panel w-full max-w-lg rounded-t-2xl border-x-0 border-b-0 pb-[env(safe-area-inset-bottom,0px)]">
    <div class="flex justify-center pt-3 pb-1" aria-hidden="true">
      <span class="h-1 w-10 rounded-full bg-gray-300/90"></span>
    </div>

    <div class="px-4 pb-2 pt-1 sm:px-5">
      <h2 id="lista-contextual-sheet-titulo" class="truncate text-base font-semibold leading-tight text-fg"></h2>
      <p id="lista-contextual-sheet-meta" class="mt-0.5 truncate text-[12px] leading-tight text-gray-500"></p>
    </div>

    <nav id="lista-contextual-sheet-nav" class="px-2 pb-4 sm:px-3" aria-label="Ações do item"></nav>
  </div>
</div>
