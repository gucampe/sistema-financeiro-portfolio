{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GranaGo | {% block title %}{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'img/icons/logo.svg' %}">
    <link rel="alternate icon" type="image/png" href="{% static 'img/icons/logo.png' %}">
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'img/icons/logo.ico' %}">

    <link rel="stylesheet" href="{% static 'css/output.css' %}" />
  </head>
  <body class="bg-[#F4F5F7] min-h-screen flex flex-col">
  {% block show_header_sidebar %}
    {% include "base/header.html" %}
    {% include 'base/sidebar.html' %}
  {% endblock %}
  {% block content %}

  {% endblock %}

    <script src="{% static 'js/sidebar.js' %}"></script>
  </body>
</html>
