{% load static %}
{# Navegação principal — static/css/sidebar.css e static/js/sidebar.js #}

<aside
  id="sidebar"
  class="app-sidebar"
  aria-label="Navegação principal"
>
  <div class="app-sidebar__inner">
    <a class="app-sidebar__brand" href="{% url 'relatorios:home' %}" title="GranaGo — início">
      <img src="{% static 'img/icons/logo.svg' %}" alt="" width="32" height="32" />
      <span class="app-sidebar__brand-text">GranaGo</span>
    </a>

    <a class="app-sidebar__cta" href="{% url 'transacoes:adicionar' %}" title="Adicionar transação">
      <svg class="app-sidebar__cta-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 5v14M5 12h14" />
      </svg>
      <span class="app-sidebar__cta-text">Adicionar transação</span>
    </a>

    <nav class="app-sidebar__nav" aria-label="Seções">
      <ul class="app-sidebar__list">
        <li>
          <a class="app-sidebar__link js-sidebar-nav" href="{% url 'relatorios:home' %}" title="Relatórios">
            <svg class="app-sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="7" height="9" rx="1" />
              <rect x="14" y="3" width="7" height="5" rx="1" />
              <rect x="14" y="12" width="7" height="9" rx="1" />
              <rect x="3" y="16" width="7" height="5" rx="1" />
            </svg>
            <span class="app-sidebar__label">Relatórios</span>
          </a>
        </li>
        <li>
          <a class="app-sidebar__link js-sidebar-nav" href="{% url 'transacoes:historico' %}" title="Transações">
            <svg class="app-sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 6h16M4 12h10M4 18h14" />
            </svg>
            <span class="app-sidebar__label">Transações</span>
          </a>
        </li>
        <li>
          <a class="app-sidebar__link js-sidebar-nav" href="{% url 'categorias:home' %}" title="Categorias">
            <svg class="app-sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 0 1 0 2.828l-7 7a2 2 0 0 1-2.828 0l-7-7A1.994 1.994 0 0 1 3 12V7a4 4 0 0 1 4-4z" />
            </svg>
            <span class="app-sidebar__label">Categorias</span>
          </a>
        </li>
        <li>
          <a class="app-sidebar__link js-sidebar-nav" href="{% url 'contas:home' %}" title="Contas">
            <svg class="app-sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 10.75 12 2.25 22 10.75" />
              <path d="M6 10.75V21M10 10.75V21M14 10.75V21M18 10.75V21" />
              <path d="M2 21h20" />
            </svg>
            <span class="app-sidebar__label">Contas</span>
          </a>
        </li>
        <li>
          <a class="app-sidebar__link js-sidebar-nav" href="{% url 'cartoes:home' %}" title="Cartões">
            <svg class="app-sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="5" width="20" height="14" rx="2" />
              <path d="M2 9.5h20" />
              <rect x="4.5" y="12" width="5" height="5" rx="1" />
            </svg>
            <span class="app-sidebar__label">Cartões</span>
          </a>
        </li>
        <li>
          <a class="app-sidebar__link js-sidebar-nav" href="{% url 'usuarios:configuracoes' %}" title="Configurações">
            <svg class="app-sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <span class="app-sidebar__label">Configurações</span>
          </a>
        </li>
      </ul>

      {% block sidebar_nav_extra %}{% endblock %}
    </nav>

    <div class="app-sidebar__footer">
      <button type="button" class="app-sidebar__collapse" id="sidebarDesktopCollapse" aria-pressed="false" title="Recolher menu" data-label-expand="Expandir menu" data-label-collapse="Recolher menu">
        <svg class="app-sidebar__collapse-icon app-sidebar__collapse-icon--collapse" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M11 19l-7-7 7-7M18 19l-7-7 7-7" />
        </svg>
        <svg class="app-sidebar__collapse-icon app-sidebar__collapse-icon--expand" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M13 5l7 7-7 7M6 5l7 7-7 7" />
        </svg>
        <span class="app-sidebar__collapse-label">Recolher</span>
      </button>
      <button type="button" class="app-sidebar__close-mobile" id="sidebarCloseMobile">
        Fechar menu
      </button>
    </div>
  </div>
</aside>

<div class="app-sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>
