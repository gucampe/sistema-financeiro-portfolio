{% load static %}
<!-- sidebar.html -->
<div id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-[#F4F5F7] shadow-md transform -translate-x-full transition-transform duration-300 ease-in-out z-50">
  <div class="pt-6 p-6 flex flex-col h-full">

    <!-- Logo + nome -->
    <div class="flex items-center space-x-3 mb-8">
    <img src="{% static 'img/logo.svg' %}" alt="Logo" class="h-8">
    <span class="text-lg font-semibold text-[#2ECC71]">GranaGo</span>
    </div>


    <!-- Menu -->
    <nav class="flex-1 overflow-y-auto">
      <ul class="space-y-4 text-gray-800">
        <li>
          <a href="#" class="block px-4 py-2 rounded bg-white text-[#2ECC71] font-semibold hover:bg-[#EAEAEA] transition">
            Dashboard
          </a>
        </li>
        <li>
          <a href="#" class="block px-4 py-2 rounded bg-white hover:bg-[#EAEAEA] transition">
            Metas <span class="ml-2 inline-block bg-[#F1C40F] text-xs font-bold text-white px-2 rounded-full">3</span>
          </a>
        </li>
        <li>
          <a href="#" class="block px-4 py-2 rounded bg-white hover:bg-[#EAEAEA] transition">
            Investimentos <span class="ml-2 inline-block bg-[#F1C40F] text-xs font-bold text-white px-2 rounded-full">!</span>
          </a>
        </li>
        <li>
          <a href="#" class="block px-4 py-2 rounded bg-white hover:bg-[#EAEAEA] transition">
            Relatórios
          </a>
        </li>
        <li>
          <a href="#" class="block px-4 py-2 rounded bg-white hover:bg-[#EAEAEA] transition">
            Configurações
          </a>
        </li>
      </ul>
    </nav>

    <!-- Botão fechar -->
    <button id="closeSidebar" class="mt-auto px-4 py-2 bg-[#2ECC71] text-white rounded hover:bg-green-600 transition">
      Fechar
    </button>
  </div>
</div>

<!-- Overlay -->
<div id="sidebarOverlay" class="fixed inset-0 bg-black bg-opacity-30 hidden z-40"></div>
