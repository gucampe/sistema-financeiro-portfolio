{% comment %}Apenas menu mobile — o restante do header fica em base.html{% endcomment %}
<div class="flex items-center shrink-0">
  <button
    type="button"
    id="openSideBar"
    class="md:hidden -ml-0.5 flex items-center justify-center rounded-lg p-2 text-gray-600 transition-colors duration-150 hover:bg-gray-900/[0.06] hover:text-gray-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-400/50 focus-visible:ring-offset-2"
    aria-controls="sidebar"
    aria-expanded="false"
    aria-label="Abrir menu de navegação"
  >
    <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>
</div>
