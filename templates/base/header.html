{% load static %}

<header class="bg-[#F4F5F7] w-full">
  <div class="w-full px-4">
    <div class="flex justify-between items-center h-16">

      <!-- Menu e Logo -->
      <div class="flex items-center space-x-4">
        <!-- Ícone de menu -->
        <button
          type="button"
          id="openSideBar"
          class="md:hidden text-gray-600 hover:text-gray-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-green-500 focus-visible:ring-offset-2 rounded"
          aria-controls="sidebar"
          aria-expanded="false"
          aria-label="Abrir menu de navegação"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>

        <!-- Logo -->
        <img src="{% static 'img/icons/logo.svg' %}" alt="Logo" class="h-8">
        
        <!-- Nome do sistema -->
        <a href="{% url 'dashboard:home' %}" class="text-lg font-semibold text-[#2ECC71]">GranaGo</a>
      </div>

      <!-- Parte direita do header -->
      <div class="flex items-center space-x-6">
        
        <!-- Botão de Tutoriais -->
        <button class="flex items-center space-x-2 bg-white text-gray-800 px-4 py-1.5 rounded-md shadow-sm hover:bg-gray-100 transition">
          <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M3 6h18M3 14h18M3 18h18" />
          </svg>
          <span class="font-medium">Tutoriais</span>
        </button>

        <!-- Saudação -->
        <div class="flex flex-col items-end justify-center space-y-0.5">
          <p class="text-sm text-gray-800 font-medium leading-none">
            {% if request.user.is_authenticated %}
              Olá, {{ request.user.nome }}
            {% endif %}
          </p>
          <form method="post" action="{% url 'usuarios:logout' %}">
            {% csrf_token %}
            <button type="submit" class="text-xs text-[#2ECC71] hover:underline leading-none">Sair</button>
          </form>
        </div>

        <!-- Avatar -->
        <img src="{% static 'img/wallpaper.jpg' %}" alt="Avatar" class="h-10 w-10 rounded-full border border-gray-300">
      </div>
    </div>
  </div>
</header>
