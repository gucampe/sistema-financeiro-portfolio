{% load static %}
<div class="flex shrink-0 items-center gap-3 sm:gap-5 pl-2 sm:pl-0">
  {% if request.user.is_authenticated %}
  <button
    type="button"
    data-tema-toggle
    class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-xl border border-gray-300/70 bg-surface-elevated/60 text-gray-700 shadow-sm backdrop-blur-sm transition-all duration-150 hover:border-gray-400/80 hover:bg-surface-elevated hover:shadow-md focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500/40 focus-visible:ring-offset-2 active:scale-[0.99] sm:h-10 sm:w-10"
    aria-pressed="{% if tema_escuro %}true{% else %}false{% endif %}"
    aria-label="{% if tema_escuro %}Ativar modo claro{% else %}Ativar modo escuro{% endif %}"
    title="{% if tema_escuro %}Modo claro{% else %}Modo escuro{% endif %}"
  >
    <svg class="h-4 w-4 {% if tema_escuro %}hidden{% endif %}" data-tema-icon="lua" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M21 14.1A8.5 8.5 0 1110.9 3 7 7 0 0021 14.1z" />
    </svg>
    <svg class="h-4 w-4 {% if not tema_escuro %}hidden{% endif %}" data-tema-icon="sol" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.364 6.364l-1.414-1.414M7.05 7.05 5.636 5.636m12.728 0L16.95 7.05M7.05 16.95l-1.414 1.414M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
    </svg>
  </button>
  {% endif %}
  <button
    type="button"
    id="btn-tutoriais-header"
    title="Ajuda"
    class="js-tutoriais-trigger hidden min-h-12 items-center gap-2 rounded-xl border border-gray-300/70 bg-white/60 px-2.5 py-1.5 text-sm font-medium text-gray-700 shadow-sm backdrop-blur-sm transition-all duration-150 hover:border-gray-400/80 hover:bg-white/90 hover:shadow-md focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-400/40 focus-visible:ring-offset-2 active:scale-[0.99] md:inline-flex"
  >
    <span
      class="flex h-6 w-6 shrink-0 items-center justify-center rounded-md bg-gray-100/90 text-gray-500"
      aria-hidden="true"
    >
      <svg class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M3 6h18M3 14h18M3 18h18" />
      </svg>
    </span>
    <span>Ajuda</span>
  </button>

  <div class="hidden min-w-0 items-center justify-end md:flex">
    <p class="max-w-[9rem] truncate text-right text-sm font-medium leading-tight text-gray-800 sm:max-w-[15rem]">
      {% if request.user.is_authenticated %}
        Olá, {{ request.user.nome }}
      {% endif %}
    </p>
  </div>

  <div class="relative flex shrink-0 items-center" id="header-user-menu">
    <button
      type="button"
      id="header-user-menu-trigger"
      class="inline-flex shrink-0 items-center justify-center rounded-full border-0 bg-transparent p-0 leading-none focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-400/50 focus-visible:ring-offset-2"
      aria-expanded="false"
      aria-haspopup="true"
      aria-controls="header-user-menu-panel"
      title="Menu da conta"
    >
      {% if header_foto_url %}
        <img
          src="{{ header_foto_url }}"
          alt="Foto de perfil"
          class="block h-9 w-9 shrink-0 rounded-full border border-gray-300/80 object-cover ring-1 ring-gray-900/[0.04] sm:h-10 sm:w-10"
          width="40"
          height="40"
        />
      {% else %}
        <span
          class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-gray-300/80 bg-gradient-to-br from-gray-100 to-gray-200/90 text-xs font-semibold leading-none text-gray-600 ring-1 ring-gray-900/[0.04] sm:h-10 sm:w-10 sm:text-sm"
          aria-hidden="true"
        >{{ header_iniciais_avatar }}</span>
      {% endif %}
    </button>

    <div
      id="header-user-menu-panel"
      class="header-user-menu-panel hidden absolute right-0 top-full z-50 mt-2 w-48 origin-top-right rounded-xl border border-gray-200 bg-white py-1 shadow-lg ring-1 ring-black/5"
      role="menu"
      aria-labelledby="header-user-menu-trigger"
    >
      <a
        href="{% url 'usuarios:configuracoes' %}#perfil"
        role="menuitem"
        class="header-user-menu-item block px-4 py-2.5 text-sm font-medium text-gray-700 transition hover:bg-gray-50"
      >
        Perfil
      </a>
      <a
        href="{% url 'usuarios:configuracoes' %}#preferencias"
        role="menuitem"
        class="header-user-menu-item block px-4 py-2.5 text-sm font-medium text-gray-700 transition hover:bg-gray-50"
      >
        Preferências
      </a>
      <div class="my-1 border-t border-gray-100" role="separator"></div>
      <form method="post" action="{% url 'usuarios:logout' %}" role="none" class="m-0">
        {% csrf_token %}
        <button
          type="submit"
          role="menuitem"
          class="header-user-menu-item block w-full px-4 py-2.5 text-left text-sm font-medium text-red-600 transition hover:bg-red-50"
        >
          Sair
        </button>
      </form>
    </div>
  </div>
</div>

<script src="{% static 'js/header_user_menu.js' %}" defer></script>
