{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>{% block title %}Erro{% endblock %} | GranaGo</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'img/icons/logo.svg' %}" />
    <link rel="stylesheet" href="{% static 'css/output.css' %}" />
  </head>
  <body class="flex min-h-screen flex-col bg-surface font-sans antialiased text-fg">
    <header class="w-full px-6 py-6">
      <a
        href="{{ brand_url|default:'/' }}"
        class="inline-flex items-center gap-2 text-brand-600 no-underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2 rounded-lg"
      >
        <img
          src="{% static 'img/icons/logo.svg' %}"
          alt=""
          width="32"
          height="32"
          class="h-8 w-8"
          aria-hidden="true"
        />
        <span class="text-lg font-semibold tracking-tight">GranaGo</span>
      </a>
    </header>

    <main
      id="error-main"
      class="mx-auto flex w-full max-w-lg flex-1 flex-col justify-center px-6 py-12"
      tabindex="-1"
    >
      <p class="mb-3 text-sm font-medium tabular-nums text-fg-muted" aria-hidden="true">
        {% block status_code %}{% endblock %}
      </p>
      <h1 class="text-2xl font-semibold tracking-tight text-fg sm:text-3xl">
        {% block heading %}{% endblock %}
      </h1>
      <p class="mt-3 text-base leading-relaxed text-fg-muted">
        {% block message %}{% endblock %}
      </p>

      <div class="mt-8 flex flex-col gap-3 sm:flex-row sm:flex-wrap">
        {% block actions %}{% endblock %}
      </div>
    </main>

    <footer class="px-6 py-6 text-center text-sm text-fg-muted">
      Controle Financeiro Essencial
    </footer>
  </body>
</html>
