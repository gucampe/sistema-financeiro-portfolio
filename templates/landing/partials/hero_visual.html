{% load static %}

<div class="lp-hero-visual lp-reveal lp-reveal--delay" data-hero-visual>
  <div class="lp-hero-visual__stage">
    <div class="lp-hero-person-slot lp-hero-person-slot--photo" aria-hidden="true">
      <span class="lp-hero-person-slot__silhouette" aria-hidden="true"></span>
      <img
        class="lp-hero-person lp-hero-person--photo"
        data-hero-person
        src="{% static 'img/landing/hero-person.webp' %}"
        alt="Pessoa usando o GranaGo no celular"
        width="1254"
        height="1428"
        decoding="async"
        fetchpriority="high"
      />
    </div>

    <div class="lp-floating-ui" aria-hidden="true">
      <div class="lp-float-item lp-float-item--kpi lp-float-item--depth-front">
        {% include "landing/partials/float/kpi_receitas.html" %}
      </div>

      <div class="lp-float-item lp-float-item--cat-1 lp-float-item--depth-front">
        {% include "landing/partials/float/category.html" with merchant="iFood" category="Alimentação" %}
      </div>

      <div class="lp-float-item lp-float-item--categorias lp-float-item--depth-front lp-float-item--focus">
        {% include "landing/partials/float/categorias_despesas.html" %}
      </div>
    </div>
  </div>
</div>
