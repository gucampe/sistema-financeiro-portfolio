{% load static %}

>

    <a href="{% url 'usuarios:landing' %}" class="flex shrink-0 items-center gap-2.5 no-underline">

    <nav class="flex items-center gap-2 sm:gap-3" aria-label="Ações principais">
      <a href="{% url 'usuarios:login' %}" class="btn btn-secondary btn-sm hidden sm:inline-flex">Entrar</a>
