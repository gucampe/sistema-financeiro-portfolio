{% load static %}
<header
  id="lp-header"
  class="lp-header sticky top-0 z-30 border-b border-transparent backdrop-blur-md"
>
  <div class="lp-container flex h-16 items-center justify-between gap-4 sm:h-[4.5rem]">
    <a href="{% url 'usuarios:landing' %}" class="flex shrink-0 items-center gap-2.5 no-underline">
      <img src="{% static 'img/icons/logo.svg' %}" alt="" class="h-8 w-8 sm:h-9 sm:w-9" width="36" height="36" />
      <span class="text-lg font-semibold tracking-tight text-brand-600 sm:text-xl">GranaGo</span>
    </a>
    <nav class="flex items-center gap-2 sm:gap-3" aria-label="Ações principais">
      <a href="{{ app_login_url }}" class="btn btn-secondary btn-sm hidden sm:inline-flex">Entrar</a>
      <button
        type="button"
        class="btn btn-primary lp-btn-premium btn-sm px-4 sm:px-5"
        data-open-captura
        data-captura-fallback="{% url 'usuarios:landing' %}#garantir-vaga"
      >
        Quero minha vaga
      </button>
    </nav>
  </div>
</header>
