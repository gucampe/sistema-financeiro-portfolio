<section class="rel-secao-shell rounded-2xl border border-gray-200/70 bg-gradient-to-br from-indigo-50/30 via-surface-elevated to-surface-muted p-5 sm:p-7" aria-label="Insights patrimoniais">
  <div class="rel-secao-cabecalho min-w-0">
    <h3 class="rel-secao-titulo">Insights</h3>
    <p class="rel-secao-subtitulo">Observações automáticas sobre seu patrimônio e fluxo</p>
  </div>

  <ul class="space-y-3">
    {% for item in insights_contas %}
    <li class="flex gap-3 rounded-xl border border-white/80 bg-white/90 px-4 py-3.5 shadow-sm ring-1 ring-gray-100/80">
      <span
        class="mt-0.5 flex h-8 w-8 shrink-0 items-center justify-center rounded-lg {% if item.nivel == 'aviso' %}bg-amber-100 text-amber-800{% elif item.nivel == 'destaque' %}bg-indigo-100 text-indigo-800{% else %}bg-gray-100 text-gray-600{% endif %}"
        aria-hidden="true"
      >
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
      </span>
      <div class="min-w-0">
        <p class="text-sm font-semibold text-gray-900">{{ item.titulo }}</p>
        <p class="mt-0.5 text-sm leading-relaxed text-gray-600">{{ item.mensagem }}</p>
      </div>
    </li>
    {% endfor %}
  </ul>
</section>
