{% comment %}Portal lateral de filtros — compartilhado pelas páginas analíticas.{% endcomment %}
<div id="filtros-portal" class="filtros-portal" data-open="false" aria-hidden="true">
  <div id="filtros-portal-backdrop" class="filtros-portal__backdrop" aria-hidden="true"></div>
  <aside
    id="filtros-portal-panel"
    class="filtros-portal__panel flex max-h-[calc(100dvh-2rem)] flex-col overflow-hidden rounded-3xl border border-gray-200/70 bg-white/95 shadow-2xl shadow-black/10 backdrop-blur-xl"
    role="dialog"
    aria-modal="true"
    aria-labelledby="filtros-portal-title"
  >
    <header class="filtros-portal__header shrink-0">
      <div class="min-w-0 flex-1">
        <h2 id="filtros-portal-title" class="text-base font-semibold text-gray-900">Filtros</h2>
        <p class="text-xs text-gray-500">Refine o período e as dimensões da análise</p>
      </div>
      <button type="button" id="btn-fechar-filtros-portal" class="shrink-0 rounded-lg p-2 text-gray-500 hover:bg-gray-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-500/40" aria-label="Fechar filtros">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
      </button>
    </header>
    <div class="filtros-portal__content flex min-h-0 flex-col">
      {% with filtros_embed="panel" %}
        {% include 'relatorios/partials/filtros_relatorio_form.html' %}
      {% endwith %}
    </div>
  </aside>
</div>
