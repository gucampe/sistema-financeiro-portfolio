{% load static %}
{% comment %}Barra de filtros GET — telas de relatório exceto visão geral (drawer).{% endcomment %}
<div class="card-dense mb-6 overflow-hidden">
  <div class="border-b border-gray-100 bg-gradient-to-r from-surface-muted/70 to-white px-4 py-3.5 sm:px-5">
    <div class="flex flex-wrap items-center gap-3">
      <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-brand-500/10 text-brand-700 ring-1 ring-brand-500/15" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
        </svg>
      </span>
      <div class="min-w-0 flex-1">
        <h3 class="text-sm font-semibold text-gray-900 tracking-tight">Filtros do relatório</h3>
        <p class="text-xs text-gray-500 mt-0.5 leading-snug">Os mesmos critérios são mantidos ao trocar de aba.</p>
      </div>
    </div>
  </div>
  <div class="p-4 sm:p-5">
    {% include 'relatorios/partials/filtros_relatorio_form.html' %}
  </div>
</div>
<link rel="stylesheet" href="{% static 'relatorios/css/relatorios-filtros.css' %}" />
<script src="{% static 'relatorios/js/filtros_categoria.js' %}"></script>
<script src="{% static 'relatorios/js/filtros_preset.js' %}"></script>
