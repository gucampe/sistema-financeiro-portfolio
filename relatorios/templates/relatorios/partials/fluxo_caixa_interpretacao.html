{% if interpretacao %}
<article class="rounded-2xl border border-gray-100 bg-surface-muted/20 px-5 py-4 sm:px-6 sm:py-5" aria-label="Leitura do fluxo">
  <h3 class="mb-2 text-xs font-semibold uppercase tracking-wider text-gray-500">Leitura do mês</h3>
  <ul class="space-y-2">
    {% for frase in interpretacao %}
    <li class="text-sm leading-relaxed text-gray-700">{{ frase }}</li>
    {% endfor %}
  </ul>
</article>
{% endif %}
