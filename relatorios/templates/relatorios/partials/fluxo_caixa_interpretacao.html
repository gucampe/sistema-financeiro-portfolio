{% if interpretacao %}
<article id="flx-interpretacao" class="rel-secao-shell rounded-2xl border border-brand-100 bg-brand-50/40 p-5 sm:border-gray-100/80 sm:bg-surface-muted/15 sm:p-7" aria-label="Insights do fluxo">
  <h3 class="rel-secao-titulo">Insights do mês</h3>
  <ul class="flx-interpretacao__lista mt-3 space-y-1.5">
    {% for frase in interpretacao %}
    <li class="flx-interpretacao__item text-sm leading-[1.65] text-gray-700 sm:leading-relaxed">{{ frase }}</li>
    {% endfor %}
  </ul>
</article>
{% endif %}
