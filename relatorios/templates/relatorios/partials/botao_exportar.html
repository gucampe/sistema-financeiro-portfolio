{% comment %}Botão contextual de exportação.{% endcomment %}
<button type="button"
        class="js-abrir-export btn btn-secondary btn-sm w-full sm:w-auto"
        data-dominio="{{ export_dominio|default:'transacoes' }}"
        {% if filtros_querystring %}data-filtros-query="{{ filtros_querystring }}"{% endif %}
        aria-haspopup="dialog">
  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
  </svg>
  <span>Exportar</span>
</button>
