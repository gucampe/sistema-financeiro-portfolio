<div id="overlay-adicionar-categoria"
     class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 transition-opacity duration-300 opacity-0 flex items-center justify-center">
  <div class="bg-white rounded-2xl shadow-md p-8 w-full max-w-md relative transform scale-95 transition-all duration-300">
    <button id="btn-fechar-categoria" class="absolute top-2 right-2 text-gray-500 hover:text-gray-800">✕</button>
    <h2 class="text-2xl font-semibold text-gray-800 mb-6">Nova Categoria</h2>

    <!-- Mensagem de erro -->
    <div id="erro-categoria" class="hidden mb-4 p-3 rounded-md bg-red-100 text-red-700 text-sm"></div>

    <form id="form-adicionar-categoria" method="POST" action="{% url 'categorias:adicionar' %}">
      {% csrf_token %}

      <!-- Nome -->
      <div class="mb-4">
        <label for="nome" class="block text-sm font-medium text-gray-700 mb-1">Nome</label>
        <input type="text" name="nome" id="nome" required 
               class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <!-- Ícone -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">Ícone</label>
        <div id="icon-grid" class="grid grid-cols-6 gap-3">
          {% for value, label in icones %}
          <div class="relative cursor-pointer border rounded-lg p-3 flex items-center justify-center hover:bg-gray-100"
              data-value="{{ value }}">
            <i class="fas {{ value }} text-xl"></i>
            <!-- Check -->
            <span class="check-icon hidden absolute top-1 right-1 text-blue-600 text-xs font-bold">✔</span>
          </div>
          {% endfor %}
        </div>
        <input type="hidden" name="icone" id="icone" required>
      </div>

      <!-- Cor -->
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">Cor</label>
        <div id="color-grid" class="grid grid-cols-8 gap-3">
          {% for value, label in cores %}
          <div class="relative cursor-pointer w-8 h-8 rounded-full border-2 flex items-center justify-center"
              style="background-color: {{ value }};"
              data-value="{{ value }}">
            <!-- Check -->
            <span class="check-color hidden text-white text-sm font-bold">✔</span>
          </div>
          {% endfor %}
        </div>
        <input type="hidden" name="cor" id="cor" required>
        <input type="hidden" name="categoria_id" id="categoria_id">
      </div>

      <button type="submit" 
              class="w-full py-2 px-4 bg-blue-600 text-white rounded-md hover:bg-blue-700">Salvar</button>
      <!-- Campo hidden para edição -->
      

    </form>
  </div>
</div>
