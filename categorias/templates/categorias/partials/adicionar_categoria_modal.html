<div id="overlay-adicionar-categoria"
class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 transition-opacity duration-300 opacity-0 flex items-center justify-center">

  <div class="bg-white rounded-2xl shadow-md p-8 w-full max-w-md relative transform scale-95 transition-all duration-300">
    <button id="btn-fechar-categoria" class="absolute top-2 right-2 text-gray-500 hover:text-gray-800">✕</button>
    <h2 class="text-2xl font-semibold text-gray-800 mb-6">Nova Categoria</h2>

    <form id="form-adicionar-categoria" method="POST" action="{% url 'categorias:adicionar' %}">
      {% csrf_token %}
      <div class="mb-4">
        <label for="nome" class="block text-sm font-medium text-gray-700 mb-1">Nome</label>
        <input type="text" name="nome" id="nome" required 
               class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>
      <button type="submit" 
              class="w-full py-2 px-4 bg-blue-600 text-white rounded-md hover:bg-blue-700">Salvar</button>
    </form>
  </div>
</div>
