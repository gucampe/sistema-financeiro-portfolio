<div id="overlay-adicionar-categoria" data-modal data-modal-fade="300" class="modal-overlay hidden"
     data-modal-labelledby="modal-categoria-titulo">

  <div data-modal-panel class="modal-panel mx-auto w-full max-w-lg">
    <div class="flex shrink-0 items-start justify-between gap-4 border-b border-gray-100 px-5 py-4 sm:px-6 sm:py-5">
      <div class="min-w-0 pr-2">
        <h2 id="modal-categoria-titulo" class="text-xl font-semibold leading-tight text-fg sm:text-2xl">Nova Categoria</h2>
        <p class="text-sm text-fg-muted">Defina tipo, nome, ícone e cor.</p>
      </div>
      <button id="btn-fechar-categoria"
              type="button"
              data-modal-close
              class="shrink-0 flex h-10 w-10 items-center justify-center rounded-xl border border-gray-200 bg-gray-100 text-fg transition hover:bg-gray-200"
              aria-label="Fechar modal">
        ✕
      </button>
    </div>

    <div id="erro-categoria"
         class="hidden shrink-0 mx-5 mt-4 rounded-xl border border-danger-border bg-danger-soft px-4 py-3 text-sm text-danger sm:mx-6">
    </div>

    <form id="form-adicionar-categoria"
          method="POST"
          action="{% url 'categorias:adicionar' %}"
          class="flex min-h-0 flex-1 flex-col overflow-hidden">
      {% csrf_token %}

      <div class="modal-panel__body min-w-0 space-y-4 px-5 py-4 sm:px-6">
      <div>
        <label for="tipo" class="mb-1 block text-sm font-medium text-fg">Tipo</label>
        <select name="tipo" id="tipo" required class="input w-full">
          <option value="despesa">Despesa</option>
          <option value="receita">Receita</option>
        </select>
      </div>

      <div>
        <label for="nome" class="mb-1 block text-sm font-medium text-fg">Nome</label>
        <input type="text" name="nome" id="nome" required class="input w-full" placeholder="Ex.: Supermercado">
      </div>

      <div class="min-w-0">
        <label class="mb-2 block text-sm font-medium text-fg">Ícone</label>
        <div id="icon-grid" class="grid grid-cols-5 gap-2 sm:grid-cols-6 sm:gap-3">
          {% for value in icones %}
            <div class="relative flex cursor-pointer items-center justify-center rounded-lg border border-gray-300 p-3 transition hover:bg-gray-100"
                 data-value="{{ value }}">
              <i class="fas {{ value }} text-xl text-fg"></i>
              <span class="check-icon absolute right-1 top-1 hidden text-xs font-bold text-brand-600">✔</span>
            </div>
          {% endfor %}
        </div>
        <input type="hidden" name="icone" id="icone" required>
      </div>

      <div class="min-w-0">
        <label class="mb-2 block text-sm font-medium text-fg">Cor</label>
        <div id="color-grid" class="grid grid-cols-6 gap-2 sm:grid-cols-8 sm:gap-3">
          {% for value, label in cores %}
            <div class="relative flex h-8 w-8 cursor-pointer items-center justify-center rounded-full border-2 border-gray-300 transition hover:scale-105"
                 style="background-color: {{ value }};"
                 data-value="{{ value }}"
                 title="{{ label }}">
              <span class="check-color hidden text-sm font-bold text-white">✔</span>
            </div>
          {% endfor %}
        </div>
        <input type="hidden" name="cor" id="cor" required>
        <input type="hidden" name="categoria_id" id="categoria_id">
      </div>
      </div>

      <div class="modal-panel__footer px-5 py-4 sm:px-6">
        <button type="submit" class="btn btn-primary btn-block">Salvar</button>
        <p class="mt-3 text-center text-xs text-fg-muted">Você pode editar ou excluir categorias depois.</p>
      </div>
    </form>
  </div>
</div>
