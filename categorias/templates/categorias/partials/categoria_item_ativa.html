<li
  role="listitem"
  data-categoria-item
  data-id="{{ categoria.id }}"
  data-tipo="{{ categoria.tipo }}"
  class="group relative -mx-4 px-4 py-2.5 transition hover:bg-surface-muted active:bg-surface-muted sm:-mx-5 sm:px-5"
>
  <div class="flex min-w-0 items-center gap-2 md:grid md:grid-cols-[minmax(0,1fr)_auto] md:items-center md:gap-4">
    <div class="flex min-w-0 flex-1 items-center gap-2.5 md:min-w-0">
      <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl border bg-[{{ categoria.cor }}20] border-[{{ categoria.cor }}40]">
        <i class="fas {{ categoria.icone }} text-[15px] text-[{{ categoria.cor }}]"></i>
      </div>
      <div class="min-w-0 flex-1">
        <p class="nome-categoria truncate text-sm font-semibold leading-tight text-fg" title="{{ categoria.nome }}">
          {{ categoria.nome }}
        </p>
        {% if categoria.usuario == None %}
          <p class="mt-0.5 truncate text-[12px] leading-tight text-gray-500">Categoria padrão · não editável</p>
        {% endif %}
      </div>
    </div>

    <div class="flex shrink-0 flex-row items-center justify-end gap-1.5 min-w-0 sm:gap-2 md:gap-3">
      {% if categoria.usuario %}
      <div class="inline-flex shrink-0 items-center gap-2">
        <button type="button" class="editar-categoria inline-flex items-center gap-2 rounded-lg bg-gray-200 px-2 py-1.5 text-sm text-gray-800 transition hover:bg-gray-300 sm:px-4 sm:py-2"
                data-id="{{ categoria.id }}" data-nome="{{ categoria.nome }}"
                data-icone="{{ categoria.icone }}" data-cor="{{ categoria.cor }}"
                data-tipo="{{ categoria.tipo }}" title="Editar">
          <i class="fa-solid fa-pen-to-square text-xs text-gray-700"></i>
          <span class="hidden sm:inline">Editar</span>
        </button>
        <button type="button" class="arquivar-categoria inline-flex items-center gap-2 rounded-lg bg-gray-200 px-2 py-1.5 text-sm text-amber-700 transition hover:bg-gray-300 sm:px-4 sm:py-2"
                data-id="{{ categoria.id }}" title="Arquivar">
          <i class="fa-solid fa-archive text-xs"></i>
          <span class="hidden sm:inline">Arquivar</span>
        </button>
      </div>
      {% else %}
        <span class="shrink-0 text-[13px] text-gray-500">Não editável</span>
      {% endif %}
    </div>
  </div>
</li>
