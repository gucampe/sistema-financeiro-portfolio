<main class="flex-grow flex items-center justify-center">
      <section class="w-full max-w-md bg-white shadow-xl rounded-2xl p-8">
        <h2 class="text-3xl font-bold text-center text-blue-700 mb-8">
          Cadastro
        </h2>

        <form action="/cadastrar" method="post" class="space-y-6">
          <div>
            <label for="nome" class="block text-sm font-semibold text-gray-700 mb-1">Nome completo</label>
            <input
              type="text"
              id="nome"
              name="nome"
              required
              class="w-full px-4 py-2 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400"
            />
          </div>

          <div>
            <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">E-mail</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              class="w-full px-4 py-2 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400"
            />
          </div>

          <div>
            <label for="senha" class="block text-sm font-semibold text-gray-700 mb-1">Senha</label>
            <input
              type="password"
              id="senha"
              name="senha"
              required
              minlength="6"
              class="w-full px-4 py-2 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400"
            />
          </div>

          <div>
            <label for="confirmar_senha" class="block text-sm font-semibold text-gray-700 mb-1">Confirmar senha</label>
            <input
              type="password"
              id="confirmar_senha"
              name="confirmar_senha"
              required
              class="w-full px-4 py-2 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-blue-400"
            />
          </div>

          <div>
            <button
              type="submit"
              class="w-full bg-blue-600 text-white py-2 rounded-xl font-semibold hover:bg-blue-700 transition duration-300 shadow-md"
            >
              Cadastrar
            </button>
          </div>
        </form>
      </section>
    </main>
