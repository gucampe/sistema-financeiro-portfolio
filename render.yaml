# Blueprint Render — deploy automático via GitHub.
# Documentação: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: sistema-financeiro
    runtime: python
    plan: free
    region: oregon
    branch: deploy-render-teste
    buildCommand: pip install -r requirements.txt && npm ci && npm run tailwind:build && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application -c gunicorn.conf.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "2"
      - key: EXPORT_JOB_BACKEND
        value: thread
      - key: ENABLE_BENCHMARK_ROUTES
        value: "False"
      - key: REDIS_URL
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: PRIVACIDADE_EMAIL
        sync: false
      - key: ENABLE_CATEGORIZACAO_LLM
        value: "False"
      - key: GEMINI_API_KEY
        sync: false
      - key: CATEGORIZACAO_LLM_MODEL
        value: gemini-2.5-flash-lite
