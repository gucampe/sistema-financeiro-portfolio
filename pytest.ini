[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
testpaths =
    financial_contracts/tests
    relatorios/tests
    cartoes/tests
    usuarios/tests
    transacoes/tests
    categorizacao/tests
    config/tests
    core/tests
    contas/tests
    categorias/tests
    tests/performance
addopts = -ra --strict-markers -p no:asyncio
markers =
    mvp: testes bloqueantes do MVP
    integrity: invariantes financeiros via UI
    concurrency: race conditions RC-*
    timezone: TZ-*
    decimal: DEC-*
    import_ofx: importação OFX
    import_planilha: importação planilha XLSX
    importacao_avancada: UNIT-IMP + E2E-IMP avançado + ledger golden + robustez
    orcamentos: planejamento orçamentário
    orcamentos_avancados: recorrência, vigência, progresso ORC-*
    orcamentos_faturas: impacto de faturas no orçamento
    relatorios: relatórios e export
    relatorios_filtros: modal de filtros FIL-*
    relatorios_consistency: consistência cross-app REL-X-*
    dashboard_kpis: suíte enxuta UNIT-DASH + E2E-DASH
    faturas_avancadas: UNIT-FAT + golden + smoke view + E2E-FAT-05..10
    synthetic: monitoramento contínuo
    cross_cutting: a11y, responsive, security
    seguranca: SEC unit + E2E + skipped RL/AUD
    migration: MIG-*
    multi_user: cenários futuros MU-*
    performance_pr: detecção estrutural N+1 (bloqueante PR)
    performance_budget: orçamento de queries por rota (validação de performance)
    performance_extended: tempo/carga EXT-* (não roda no pytest default)
    ecossistema: fluxos cross-app GLOB-U/E (transacao → dashboard → relatorio → orcamento)
    categorizacao_e2e: aprendizado longitudinal PIX via UI (servidor dev externo)
    cadastro_smoke: E2E curto de contas, categorias, configurações, onboarding e landing
